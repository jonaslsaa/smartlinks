name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --message ${{ github.sha }}

      - name: Smoke-test production
        env:
          LANDING_URL: https://smartlinks.jonaslsa.com/
          SMARTLINKS_URL: https://s.jonaslsa.com
        run: npm run worker:smoke
