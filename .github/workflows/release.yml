name: Release npm package

on:
  workflow_dispatch:

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the latest default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run releases from $DEFAULT_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi
          git fetch origin "$DEFAULT_BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]]; then
            echo "$DEFAULT_BRANCH advanced after this workflow started. Run it again." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm version that supports trusted publishing
        run: npm install --global npm@11

      - run: npm ci

      - name: Resolve version and tag
        id: release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            if [[ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]]; then
              echo "$tag does not point to the current commit." >&2
              exit 1
            fi
          else
            git tag "$tag"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git push origin "$TAG"

      - name: Check whether the package version is already published
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "@jonaslsa/smartlinks@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
