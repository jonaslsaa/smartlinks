name: Release npm package

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: Prepare release branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the latest default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Prepare releases from $DEFAULT_BRANCH, not $GITHUB_REF_NAME." >&2
            exit 1
          fi
          git fetch origin "$DEFAULT_BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]]; then
            echo "$DEFAULT_BRANCH advanced after this workflow started. Run it again." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Create version commit
        id: release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          npm version "$RELEASE" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          branch="release/$tag"

          if git rev-parse "$tag" >/dev/null 2>&1 || npm view "@jonaslsa/smartlinks@$version" version >/dev/null 2>&1; then
            echo "$tag has already been released." >&2
            exit 1
          fi

          git add package.json package-lock.json
          git commit -m "Release $tag"
          git branch -m "$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push or reuse release branch
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null; then
            git fetch origin "$RELEASE_BRANCH"
            git show FETCH_HEAD:package.json > "$RUNNER_TEMP/release-package.json"
            remote_version="$(node -p "require('$RUNNER_TEMP/release-package.json').version")"
            if [[ "v$remote_version" != "${RELEASE_BRANCH#release/}" || "$(git rev-parse FETCH_HEAD^)" != "$(git rev-parse HEAD^)" ]]; then
              echo "$RELEASE_BRANCH already exists for a different commit." >&2
              exit 1
            fi
          else
            git push --set-upstream origin "$RELEASE_BRANCH"
          fi

      - name: Show release PR link
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          pr_url="https://github.com/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$RELEASE_BRANCH?expand=1"
          {
            echo "### $TAG is ready for review"
            echo
            echo "[$TAG release PR]($pr_url)"
            echo
            echo "The package will be published automatically after the PR passes CI and is merged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start release CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: gh workflow run ci.yml --ref "$RELEASE_BRANCH"

  detect_release:
    name: Detect package release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Compare package versions
        id: version
        run: |
          current_version="$(node -p "require('./package.json').version")"
          git show "$GITHUB_SHA^:package.json" > "$RUNNER_TEMP/previous-package.json"
          previous_version="$(node -p "require('$RUNNER_TEMP/previous-package.json').version")"

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "Package version remains $current_version; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package version changed from $previous_version to $current_version."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish
    needs: detect_release
    if: needs.detect_release.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm version that supports trusted publishing
        run: npm install --global npm@11

      - run: npm ci

      - name: Resolve version and tag
        id: release
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            if [[ "$(git rev-list -n 1 "$tag")" != "$(git rev-parse HEAD)" ]]; then
              echo "$tag does not point to the current commit." >&2
              exit 1
            fi
          else
            git tag "$tag"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Push tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git push origin "$TAG"

      - name: Check whether the package version is already published
        id: registry
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "@jonaslsa/smartlinks@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
